- id: passthrough_example
  guid: 019b6bae-8fc4-49c9-aef2-2e392d022e7e
  version: 0.1.0
  author: ICE_crystal
  default_language: en
  name:
    de: Passthrough-Beispiel
    en: Passthrough Example
    fr: Exemple de transmission directe
    ja: パススルーサンプル
    ko: 패스스루 예제
    zh-hans: 直通示例
    zh-hant: 直通範例
  description:
    de: Leitet abstrakte Eingaben unverändert weiter. Passen Sie den Quellcode an, um eigene Verarbeitungslogik hinzuzufügen.
    en: Forwards abstract input unchanged. Modify the source code to add processing logic.
    fr: Transmet les entrées abstraites sans modification. Modifiez le code source pour ajouter une logique de traitement.
    ja: 抽象化された入力をそのまま転送します。ソースコードを変更して独自の処理を追加できます。
    ko: 추상화된 입력을 그대로 전달합니다. 소스 코드를 수정하여 처리 로직을 추가할 수 있습니다.
    zh-hans: 原样传递抽象输入，可修改源码添加处理逻辑。
    zh-hant: 原樣傳遞抽象化輸入，可修改原始碼加入處理邏輯。
  download_url: https://raw.githubusercontent.com/ICEcrysta1/padnorm_plugins/refs/heads/main/plugins/ICE_crystal/passthrough_example/manifest.yaml
- id: time_deadzone
  guid: ecabea6e-4e13-4dd2-bc0d-9a5afc2ced14
  version: 0.3.1
  author: ICE_crystal
  default_language: en
  name:
    en: Time Anti-Deadzone
    zh-hans: 时间反死区
    zh-hant: 時間反死區
  description:
    en: Pulses input below the deadzone and passes it through above it; can switch to static anti-deadzone mapping.
    zh-hans: 低于死区时按时间比例脉冲输出，高于死区直通；也可改用静态反死区映射。
    zh-hant: 低於死區時依時間比例脈衝輸出，高於死區直接通過；也可改用靜態反死區對應。
  download_url: https://raw.githubusercontent.com/ICEcrysta1/padnorm_plugins/refs/heads/main/plugins/ICE_crystal/time_deadzone/manifest.yaml
