fields:
  - id: min_amplitude
    type: slider
    min: 1
    max: 100
    step: 1
    unit: "%"
    value: 5
    scope: binding
    name:
      zh-hans: 最低脉冲幅度
      zh-hant: 最低脈衝幅度
    description:
      zh-hans: 输入低于此值时按该幅度脉冲输出；输入高于它时幅度自动等于输入并直接直通，不再需要补偿。该幅度必须高于下游死区；下游若会缩放死区以上的输入，需要更高。
      zh-hant: 輸入低於此值時按該幅度脈衝輸出；輸入高於它時幅度自動等於輸入並直接直通，不再需要補償。該幅度必須高於下游死區；下游若會縮放死區以上的輸入，需要更高。
  - id: pulse_width_ms
    type: slider
    min: 1
    max: 50
    step: 1
    unit: ms
    value: 4
    scope: binding
    name:
      zh-hans: 脉冲宽度
      zh-hant: 脈衝寬度
    description:
      zh-hans: 每次脉冲的持续时间。占空比由强度除以实际幅度得到，周期再由此推出；宽度越大越容易被下游采样，但低强度时等待越久。
      zh-hant: 每次脈衝的持續時間。占空比由強度除以實際幅度得到，週期再由此推出；寬度越大越容易被下游取樣，但低強度時等待越久。
  - id: deadzone
    type: slider
    min: 0
    max: 50
    step: 1
    unit: "%"
    value: 0
    scope: binding
    name:
      zh-hans: 输入死区阈值
      zh-hant: 輸入死區閾值
    description:
      zh-hans: 输入强度低于此值时完全不输出，用于抑制摇杆漂移；下游死区由“下游死区”字段单独处理。
      zh-hant: 輸入強度低於此值時完全不輸出，用於抑制搖桿漂移；下游死區由「下游死區」欄位單獨處理。
  - id: rescale_model
    type: toggle
    value: false
    scope: binding
    name:
      zh-hans: 缩放型下游补偿
      zh-hant: 縮放型下游補償
    description:
      zh-hans: 开启后改用静态反死区映射，适配“死区以上的输入会被重新缩放”的游戏；此时忽略最低脉冲幅度和脉冲宽度。关闭时保持时间脉冲模式。
      zh-hant: 開啟後改用靜態反死區映射，適配「死區以上的輸入會被重新縮放」的遊戲；此時忽略最低脈衝幅度和脈衝寬度。關閉時保持時間脈衝模式。
  - id: downstream_deadzone
    type: slider
    min: 0
    max: 50
    step: 1
    unit: "%"
    value: 0
    scope: binding
    name:
      zh-hans: 下游死区
      zh-hant: 下游死區
    description:
      zh-hans: 仅在缩放型下游补偿开启时使用。填写游戏或宿主的死区，例如 20%；插件会把输入重映射为“下游死区 + 输入 × (1 - 下游死区)”，使下游缩放后的输出与输入保持线性。估小会残留一点死区，估大会在中心产生漂移。
      zh-hant: 僅在縮放型下游補償開啟時使用。填寫遊戲或宿主的死區，例如 20%；外掛會把輸入重映射為「下游死區 + 輸入 × (1 - 下游死區)」，使下游縮放後的輸出與輸入保持線性。估小會殘留一點死區，估大會在中心產生漂移。
