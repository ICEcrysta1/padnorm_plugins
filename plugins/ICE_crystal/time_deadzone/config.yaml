fields:
  - id: pulse_width_ms
    type: slider
    min: 1
    max: 50
    step: 1
    unit: ms
    value: 4
    scope: binding
    name:
      en: Pulse width
      zh-hans: 脉宽
      zh-hant: 脈寬
    description:
      en: Duration of each pulse. Wider pulses are easier to sample, but low input waits longer. Ignored in rescale mode.
      zh-hans: 每次脉冲的时长，越大越容易被下游采样，但低强度时等待也更久。缩放模式不生效。
      zh-hant: 每次脈衝的長度，越大越容易被取樣，但低強度時等待也更久。縮放模式不生效。
  - id: game_deadzone
    type: slider
    min: 0
    max: 50
    step: 1
    unit: "%"
    value: 20
    scope: binding
    name:
      en: Game deadzone
      zh-hans: 游戏死区
      zh-hant: 遊戲死區
    description:
      en: Deadzone of the game after the host curve, e.g. 20%. Pulse mode inversely solves the pulse amplitude from the curve (slightly above the real value works best); rescale mode uses it as the downstream deadzone (use the actual value or slightly lower).
      zh-hans: 宿主曲线后的游戏死区，例如 20%。脉冲模式下按曲线反解脉冲幅度，建议略高于实际值；缩放模式下作为下游死区，填实际值或略小。
      zh-hant: 宿主曲線後的遊戲死區，例如 20%。脈衝模式下依曲線反解脈衝幅度，建議略高於實際值；縮放模式下作為下游死區，填實際值或略小。
  - id: rescale_model
    type: toggle
    value: false
    scope: binding
    name:
      en: Rescale anti-deadzone
      zh-hans: 缩放反死区
      zh-hant: 縮放反死區
    description:
      en: Switches to static anti-deadzone mapping for games that rescale input above the deadzone. The host curve is used to solve the input; only the game deadzone applies.
      zh-hans: 改用静态反死区映射，适配会重缩放死区以上输入的游戏；按宿主曲线反解输入，开启后只用游戏死区。
      zh-hant: 改用靜態反死區對應，適用於會重新縮放死區以上輸入的遊戲；依宿主曲線反解輸入，開啟後只用遊戲死區。
