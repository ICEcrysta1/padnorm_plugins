fields:
  - id: pulse_width_ms
    type: slider
    min: 1
    max: 50
    step: 1
    unit: ms
    value: 4
    scope: binding
    name:
      zh-hans: 脉冲宽度
      zh-hant: 脈衝寬度
    description:
      zh-hans: 每次脉冲的持续时间。占空比由强度除以游戏死区得到，周期再由此推出；宽度越大越容易被下游采样，但低强度时等待越久。缩放型反死区开启时不生效。
      zh-hant: 每次脈衝的持續時間。占空比由強度除以遊戲死區得到，週期再由此推出；寬度越大越容易被下游取樣，但低強度時等待越久。縮放型反死區開啟時不生效。
  - id: game_deadzone
    type: slider
    min: 0
    max: 50
    step: 1
    unit: "%"
    value: 20
    scope: binding
    name:
      zh-hans: 游戏死区
      zh-hant: 遊戲死區
    description:
      zh-hans: 填写游戏或宿主的死区，例如 20%。时间脉冲模式下按该幅度脉冲，输入超过它后直通，建议填得比实际死区略高；缩放型反死区开启时用它做静态反死区映射，填实际值或略小。
      zh-hant: 填寫遊戲或宿主的死區，例如 20%。時間脈衝模式下按該幅度脈衝，輸入超過它後直通，建議填得比實際死區略高；縮放型反死區開啟時用它做靜態反死區映射，填實際值或略小。
  - id: rescale_model
    type: toggle
    value: false
    scope: binding
    name:
      zh-hans: 缩放型反死区
      zh-hant: 縮放型反死區
    description:
      zh-hans: 开启后改用静态反死区映射，适配“死区以上的输入会被重新缩放”的游戏；此时只使用“游戏死区”，脉冲宽度不生效。关闭时保持时间脉冲模式。
      zh-hant: 開啟後改用靜態反死區映射，適配「死區以上的輸入會被重新縮放」的遊戲；此時只使用「遊戲死區」，脈衝寬度不生效。關閉時保持時間脈衝模式。
