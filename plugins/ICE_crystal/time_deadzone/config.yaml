fields:
  - id: pulse_width_ms
    type: slider
    min: 1
    max: 50
    step: 1
    unit: ms
    value: 4
    scope: binding
    name:
      en: Pulse width
      zh-hans: 脉宽
      zh-hant: 脈寬
    description:
      en: Duration of each pulse. Wider pulses are easier to sample, but low input waits longer. Ignored in rescale mode.
      zh-hans: 每次脉冲的时长，越大越容易被下游采样，但低强度时等待也更久。缩放模式不生效。
      zh-hant: 每次脈衝的長度，越大越容易被取樣，但低強度時等待也更久。縮放模式不生效。
  - id: game_deadzone
    type: slider
    min: 0
    max: 50
    step: 1
    unit: "%"
    value: 20
    scope: binding
    name:
      en: Game deadzone
      zh-hans: 游戏死区
      zh-hant: 遊戲死區
    description:
      en: Deadzone of the game or host, e.g. 20%. Pulse amplitude in pulse mode (slightly above the real value works best), mapping base in rescale mode.
      zh-hans: 游戏或宿主的死区，例如 20%。脉冲模式下是脉冲幅度，建议略高于实际值；缩放模式下是映射基准。
      zh-hant: 遊戲或宿主的死區，例如 20%。脈衝模式下是脈衝幅度，建議略高於實際值；縮放模式下是對應基準。
  - id: rescale_model
    type: toggle
    value: false
    scope: binding
    name:
      en: Rescale anti-deadzone
      zh-hans: 缩放反死区
      zh-hant: 縮放反死區
    description:
      en: Switches to static anti-deadzone mapping for games that rescale input above the deadzone. Only the game deadzone applies.
      zh-hans: 改用静态反死区映射，适配会重缩放死区以上输入的游戏；开启后只用游戏死区。
      zh-hant: 改用靜態反死區對應，適用於會重新縮放死區以上輸入的遊戲；開啟後只用遊戲死區。
